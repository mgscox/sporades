# Opt-in only. PIPELINE_QUEUE_DIR must be an operator-provisioned filesystem
# with a hard 128 MiB quota, owned by uid/gid 10001, mode 0700. See OUTAGES.md.
services:
  collector:
    user: "10001:10001"
    volumes:
      - ./collector-persistent.yaml:/etc/otelcol/config.yaml:ro
      - ${PIPELINE_QUEUE_DIR:?provide a dedicated quota-limited queue directory}:/var/lib/otelcol/queue
