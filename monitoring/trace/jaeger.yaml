extensions:
  jaeger_storage:
    backends:
      traces:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: ${env:TRACE_RETENTION:-72h}
  jaeger_query:
    storage:
      traces: traces
    http:
      endpoint: 0.0.0.0:16686
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    send_batch_size: 256
    timeout: 1s
exporters:
  jaeger_storage_exporter:
    trace_storage: traces
    queue:
      num_consumers: 2
      queue_size: 1000
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
