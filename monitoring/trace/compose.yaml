name: sporades-traces
services:
  storage-init:
    image: busybox:1.37.0
    command: ["chown", "10001:10001", "/badger"]
    volumes:
      - traces:/badger
    restart: "no"
    mem_limit: 64m
    pids_limit: 32

  grafana-init:
    image: busybox:1.37.0
    command: ["chown", "${TRACE_RUN_UID:?run setup.mjs}:${TRACE_RUN_GID:?run setup.mjs}", "/var/lib/grafana"]
    volumes:
      - grafana:/var/lib/grafana
    restart: "no"
    mem_limit: 64m
    pids_limit: 32

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    read_only: true
    user: "${TRACE_RUN_UID:?run setup.mjs}:${TRACE_RUN_GID:?run setup.mjs}"
    ports:
      - "${TRACE_BIND:-127.0.0.1}:${TRACE_PORT:-8443}:8443"
    environment:
      TRACE_TLS_MODE: ${TRACE_TLS_MODE:?run setup.mjs}
      TRACE_BIND: ${TRACE_BIND:-127.0.0.1}
      TRACE_CERT_FILE: ${TRACE_CERT_FILE:-}
      TRACE_KEY_FILE: ${TRACE_KEY_FILE:-}
    volumes:
      - ./certs:/certs:ro
      - ./.private/credentials.json:/run/secrets/trace-credentials.json:ro
    depends_on:
      - collector
      - jaeger
      - prometheus
      - grafana
    mem_limit: 192m
    cpus: 1.0
    pids_limit: 128
    logging: { options: { max-size: "10m", max-file: "3" } }

  collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    read_only: true
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    logging: { options: { max-size: "10m", max-file: "3" } }

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    command: ["--config=/etc/jaeger/config.yaml"]
    restart: unless-stopped
    environment:
      TRACE_RETENTION: ${TRACE_RETENTION:-72h}
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
      - traces:/badger
    depends_on:
      storage-init:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    logging: { options: { max-size: "10m", max-file: "3" } }

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRIC_RETENTION:-14d}
      - --storage.tsdb.retention.size=${METRIC_DISK_CAP:-8GB}
      - --web.enable-otlp-receiver
    restart: unless-stopped
    read_only: true
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - metrics:/prometheus
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    logging: { options: { max-size: "10m", max-file: "3" } }

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    user: "${TRACE_RUN_UID:?run setup.mjs}:${TRACE_RUN_GID:?run setup.mjs}"
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:8443/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
    volumes:
      - grafana:/var/lib/grafana
      - ./.private/grafana-admin-password:/run/secrets/grafana-admin-password:ro
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/sporades.yaml:ro
      - ./grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/sporades.yaml:ro
      - ./api-dashboard.json:/var/lib/grafana/provisioned/api-dashboard.json:ro
      - ./resource-dashboard.json:/var/lib/grafana/provisioned/resource-dashboard.json:ro
    depends_on:
      prometheus:
        condition: service_started
      grafana-init:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging: { options: { max-size: "10m", max-file: "3" } }

volumes:
  traces:
  metrics:
  grafana:
