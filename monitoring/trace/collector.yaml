extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 2097152
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    send_batch_size: 256
    send_batch_max_size: 256
    timeout: 1s
exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    timeout: 2s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 16777216
      num_consumers: 2
      block_on_overflow: false
      wait_for_result: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    timeout: 2s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 16777216
      num_consumers: 2
      block_on_overflow: false
      wait_for_result: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 30s
service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
