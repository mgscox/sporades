global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/pipeline-rules.yaml
storage:
  tsdb:
    # Concurrent consumers can replay older buffered samples after fresh ones.
    # Keep late ingestion finite; this is not indefinite backlog retention.
    out_of_order_time_window: 10m
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: sporades-pipeline-collector
    scrape_timeout: 3s
    sample_limit: 2000
    static_configs:
      - targets: [collector:8888]
  - job_name: sporades-pipeline-gateway
    scrape_timeout: 3s
    sample_limit: 100
    static_configs:
      - targets: [gateway:8889]
otlp:
  promote_resource_attributes:
    - service.name
    - deployment.environment.name
