name: Temporary PR 339 validation
on:
  push:
    branches: [swarm/issue-335-ken]
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: ubuntu-24.04
    name: full-suite (shard ${{ matrix.shard }}/6)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare isolated Node runner
        run: |
          mkdir -p .tmp .ci-home .ci-config .ci-npm-cache .sporades/issue-120
          chmod 755 "$PWD"
          chmod 700 .tmp .ci-home .ci-config .ci-npm-cache
          cat > .tmp/Dockerfile.validation <<'DOCKERFILE'
          FROM node:24.22.1-bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends git python3 procps util-linux openssh-client ca-certificates curl gawk && apt-get clean
          DOCKERFILE
          docker build -t sporades-pr339-validation - < .tmp/Dockerfile.validation
      - name: Install dependencies and prime offline cache
        run: |
          docker run --rm --name sporades-pr339-install --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" -w /workspace \
            -e HOME=/workspace/.ci-home -e TMPDIR=/workspace/.tmp \
            -e SPORADES_CONFIG_DIR=/workspace/.ci-config -e NPM_CONFIG_CACHE=/workspace/.ci-npm-cache \
            sporades-pr339-validation sh -c 'npm ci --no-audit --no-fund && npm run build && node scripts/prepare-offline-test-cache.mjs'
      - name: Typecheck and complete test-suite shard
        run: |
          docker run --rm --name sporades-pr339-test --user "$(id -u):$(id -g)" \
            --add-host host.localhost:127.0.0.1 --add-host team-notes.localhost:127.0.0.1 --add-host malicious.localhost:127.0.0.1 \
            --mount "type=bind,src=$PWD,dst=/workspace" -w /workspace \
            -e HOME=/workspace/.ci-home -e TMPDIR=/workspace/.tmp \
            -e SPORADES_CONFIG_DIR=/workspace/.ci-config -e NPM_CONFIG_CACHE=/workspace/.ci-npm-cache \
            -e NODE_OPTIONS=--test-shard=${{ matrix.shard }}/6 \
            sporades-pr339-validation sh -c 'npm run typecheck && npm test'
      - name: Documentation
        if: matrix.shard == 1
        run: |
          docker run --rm --name sporades-pr339-docs --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/workspace" -w /workspace \
            -e HOME=/workspace/.ci-home -e TMPDIR=/workspace/.tmp \
            -e SPORADES_CONFIG_DIR=/workspace/.ci-config -e NPM_CONFIG_CACHE=/workspace/.ci-npm-cache \
            sporades-pr339-validation npm run docs:check
