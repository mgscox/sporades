name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-docs.mjs"
      - "scripts/generate-llms-docs.mjs"
      - "src/types/**"
      - "typedoc.json"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "docs/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-docs.mjs"
      - "scripts/generate-llms-docs.mjs"
      - "src/types/**"
      - "typedoc.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, sporades]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          check-latest: true
      - run: npm ci
      - run: npm run docs:check
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: [self-hosted, linux, x64, sporades]
    timeout-minutes: 30
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
